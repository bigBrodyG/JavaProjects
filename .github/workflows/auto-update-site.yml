name: Auto-Update Java Showcase Website

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Create necessary directories
      run: |
        mkdir -p docs
        # Support both old structure (root level) and new structure (Esercizi/Laboratorio)
        for project in */src Esercizi/*/src Laboratorio/*/src; do
          if [ -d "$(dirname "$project")" ]; then
            project_name=$(dirname "$project")
            mkdir -p "$project_name/bin"
          fi
        done
    
    - name: Auto-detect and compile all Java projects
      run: |
        echo "🔍 Auto-detecting Java projects..."
        REPO_ROOT="$(pwd)"

        for project_dir in */src Esercizi/*/src Laboratorio/*/src; do
          [ -d "$project_dir" ] || continue

          project_path=$(dirname "$project_dir")
          project_name=$(basename "$project_path")
          slug=$(echo "$project_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          output_file="$REPO_ROOT/docs/${slug}-output.txt"

          java_files=$(find "$project_path/src" -name "*.java" 2>/dev/null | wc -l)
          [ "$java_files" -eq 0 ] && continue

          echo "📦 Compiling $project_name..."
          mkdir -p "$project_path/bin"
          javac -d "$project_path/bin" "$project_path/src"/*.java 2>&1 || true

          main_class=""
          if ls "$project_path/bin"/*.class 2>/dev/null | grep -q .; then
            # Try class matching project name
            candidate=$(echo "$project_name" | sed 's/[^A-Za-z0-9]//g')
            if [ -f "$project_path/bin/${candidate}.class" ]; then
              (cd "$project_path/bin" && timeout 5 java "$candidate" </dev/null >/dev/null 2>&1) && main_class="$candidate"
            fi
            # Try Main
            if [ -z "$main_class" ] && [ -f "$project_path/bin/Main.class" ]; then
              (cd "$project_path/bin" && timeout 5 java Main </dev/null >/dev/null 2>&1) && main_class="Main"
            fi
            # Try all classes
            if [ -z "$main_class" ]; then
              for class_file in "$project_path/bin"/*.class; do
                class_name=$(basename "$class_file" .class)
                if (cd "$project_path/bin" && timeout 5 java "$class_name" </dev/null >/dev/null 2>&1); then
                  main_class="$class_name"
                  break
                fi
              done
            fi
          fi

          if [ -n "$main_class" ]; then
            echo "▶️  Running $project_name ($main_class)..."
            cd "$project_path/bin"
            timeout 10 java "$main_class" </dev/null > "$output_file" 2>&1 || true
            cd "$REPO_ROOT"
            [ -s "$output_file" ] || rm -f "$output_file"
          else
            echo "⚠️  No runnable main class for $project_name"
          fi
        done
    
    - name: Generate website with all projects
      run: |
        echo "🎨 Generating website..."
        python3 .github/scripts/generate-site.py
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
